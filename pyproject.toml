[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vocabcraft"
version = "0.1.0"
description = "Safe, profile-aware vocabulary compaction for multilingual models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "VocabCraft contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "regex>=2024.5.15",
  "safetensors>=0.4.3",
  "sentencepiece>=0.2.0",
  "torch>=2.2",
  "transformers>=4.44,<6",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
  "types-regex>=2024.5.15",
]

[project.scripts]
vocabcraft = "vocabcraft.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vocabcraft"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["tests"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["integration: downloads and exercises a real model"]
