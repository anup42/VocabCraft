project:
  name: VocabCraft
  version: 0.1

model:
  # Supply the existing local STE checkpoint with the CLI --model/--original option.
  id: local-ste-checkpoint
  revision: null
  trust_remote_code: false

profile:
  id: ste-en-hi-v1
  description: English and Hindi vocabulary profile for an XLM-R sentence encoder
  languages: [en, hi]
  unicode_scripts: [Latin, Devanagari]
  calibration_files:
    - ../../examples/calibration-en-hi.jsonl
  critical_terms_files:
    - ../../examples/critical-terms.txt
  strict: true

fallback:
  policy: full_model
  fail_closed_when_unavailable: true
  record_missing_pieces: true

validation:
  maximum_new_unk_count: 0
  maximum_missing_critical_examples: 0
  encoder_max_absolute_difference: 1.0e-5
  encoder_mean_absolute_difference: 1.0e-6
  minimum_encoder_cosine_similarity: 0.999999

runtime:
  device: cpu
  dtype: float32
  batch_size: 4
